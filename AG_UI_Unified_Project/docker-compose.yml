# AG_UI_Unified_Project — Backend (Coolify / Producción)
# En Coolify se despliega exclusivamente el servicio backend.
# Para ejecutar todo en local (Backend + Frontend), usar:
#   .\run-local.bat   (o docker compose up)
# Configuración local extendida: docker-compose.local.yml / docker-compose.override.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PUBLISH_PORT:-8010}:${BACKEND_PORT:-8009}"
    environment:
      PORT: ${BACKEND_PORT:-8009}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-${VERTEX_API:-TRUE}}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-${PROJECT_ID:-}}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${GOOGLE_APPLICATION_CREDENTIALS_BASE64:-}
      DATASTORE_ID: ${DATASTORE_ID:-}
      VERTEX_SEARCH_LOCATION: ${VERTEX_SEARCH_LOCATION:-global}
      SOPORTE_DATASTORE_ID: ${SOPORTE_DATASTORE_ID:-}
      GCS_BUCKET_RESUMEN: ${GCS_BUCKET_RESUMEN:-resumen-reuniones}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-bucket_data1}
      BQ_DATASET_ID: ${BQ_DATASET_ID:-}
      BQ_LOCATION: ${BQ_LOCATION:-us-central1}
      ZOHO_REFRESH_TOKEN: ${ZOHO_REFRESH_TOKEN:-}
      ZOHO_CLIENT_ID: ${ZOHO_CLIENT_ID:-}
      ZOHO_CLIENT_SECRET: ${ZOHO_CLIENT_SECRET:-}
      ZOHO_SHEET_WORKBOOK_ID: ${ZOHO_SHEET_WORKBOOK_ID:-}
      DOWNLOAD_BASE_PATH: ${DOWNLOAD_BASE_PATH:-./cvs_descargados}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost:${BACKEND_PUBLISH_PORT:-8010}}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import os,urllib.request; urllib.request.urlopen(\"http://127.0.0.1:\"+os.environ.get(\"PORT\",\"8000\")+\"/health\")"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
